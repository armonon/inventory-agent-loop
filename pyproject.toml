[project]
name = "inventory-agent-loop"
version = "1.0.0"
description = "FastAPI inventory service + a hand-coded LLM agent loop (no agent framework)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# agent.py lives at the repo root (the brief requires a single file),
# so the root must be importable from the tests.
pythonpath = ["."]
